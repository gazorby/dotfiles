color_theme = "monokai-pro"
theme_background = false
truecolor = true
rounded_corners = true
vim_keys = true

# chezmoi owns this file; btop would otherwise rewrite it in full on exit
save_config_on_exit = false

update_ms = 1500
shown_boxes = "cpu mem net proc"
presets = "cpu:0:default,mem:0:default,net:0:default,proc:0:default cpu:0:default,proc:0:default cpu:0:block,mem:0:block"

proc_sorting = "cpu lazy"
proc_tree = false
proc_gradient = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_aggregate = true

shown_gpus = "apple"
show_gpu_info = "Auto"
show_cpu_watts = true
show_coretemp = true
cpu_single_graph = false
clock_format = "%H:%M"

mem_graphs = true
show_swap = true
swap_disk = false
only_physical = true
disks_filter = "exclude=/System/Volumes/Preboot /System/Volumes/VM /System/Volumes/Update /System/Volumes/xarts /System/Volumes/iSCPreboot /System/Volumes/Hardware"
show_io_stat = true

net_auto = true
net_sync = true
base_10_bitrate = "True"
