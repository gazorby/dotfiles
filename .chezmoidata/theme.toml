# Monokai Pro palette shared by Ghostty, WezTerm, helix, mitos, lazygit, glab-tui and fzf.
# Light is Monokai Pro Light. The *_bg tints are each accent mixed into bg
# (18% dark, 15% light); the *_soft variants are each accent mixed 60% into fg.

